[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "adopciones-dominio"
version = "0.1.0"
description = "Capa de dominio — Sistema de gestión de adopciones de mascotas"
requires-python = ">=3.11"
dependencies = []  # Cero dependencias: Python puro

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
